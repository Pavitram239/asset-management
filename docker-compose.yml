services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: asset_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asset-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_user -d asset_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: server/.env
        required: false
    environment:
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: asset_user
      PGPASSWORD: ${POSTGRES_PASSWORD:-asset-local-dev}
      PGDATABASE: asset_management
      COOKIE_SECURE: "false" # Local HTTP only; hosted HTTPS must use true.
      TRUST_PROXY_HOPS: "1" # API is reachable only through the trusted Nginx service.
      PORT: 5100
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
